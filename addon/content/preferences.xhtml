<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  style="max-width: 860px; padding: 12px"
>
  <html:h2 data-l10n-id="pref-title"></html:h2>

  <groupbox>
    <label><html:h3 data-l10n-id="pref-general-title"></html:h3></label>
    <checkbox
      preference="enableLocalClassification"
      data-l10n-id="pref-enable-local"
    />
    <hbox align="center">
      <html:label
        for="zca-max-collections"
        data-l10n-id="pref-max-collections"
      ></html:label>
      <html:input
        id="zca-max-collections"
        type="number"
        min="1"
        max="10"
        preference="maxCollectionRecommendations"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label for="zca-max-tags" data-l10n-id="pref-max-tags"></html:label>
      <html:input
        id="zca-max-tags"
        type="number"
        min="1"
        max="20"
        preference="maxTagRecommendations"
      ></html:input>
    </hbox>
    <checkbox
      preference="includeAbstracts"
      data-l10n-id="pref-include-abstracts"
    />
    <checkbox
      preference="includeAutomaticTags"
      data-l10n-id="pref-automatic-tags"
    />
    <checkbox
      preference="showExplanations"
      data-l10n-id="pref-show-explanations"
    />
    <checkbox
      preference="confirmBeforeWrite"
      checked="true"
      disabled="true"
      data-l10n-id="pref-confirm-write"
    />
    <html:label
      for="zca-excluded"
      data-l10n-id="pref-excluded-collections"
    ></html:label>
    <html:textarea
      id="zca-excluded"
      rows="5"
      preference="excludedCollectionPaths"
    ></html:textarea>
  </groupbox>

  <groupbox>
    <label><html:h3 data-l10n-id="pref-provider-title"></html:h3></label>
    <checkbox preference="remoteEnabled" data-l10n-id="pref-remote-enabled" />
    <html:label
      for="zca-provider-name"
      data-l10n-id="pref-provider-name"
    ></html:label>
    <html:input
      id="zca-provider-name"
      type="text"
      preference="providerName"
    ></html:input>
    <html:label for="zca-base-url" data-l10n-id="pref-base-url"></html:label>
    <html:input id="zca-base-url" type="url" preference="baseURL"></html:input>
    <html:label for="zca-model" data-l10n-id="pref-model"></html:label>
    <html:input id="zca-model" type="text" preference="model"></html:input>
    <html:label for="zca-api-key" data-l10n-id="pref-api-key"></html:label>
    <html:input
      id="zca-api-key"
      type="password"
      preference="apiKey"
      autocomplete="off"
    ></html:input>
    <hbox>
      <button id="zca-test-provider" data-l10n-id="pref-test-provider"></button>
      <button id="zca-clear-api-key" data-l10n-id="pref-clear-api-key"></button>
    </hbox>
    <hbox align="center">
      <html:label for="zca-timeout" data-l10n-id="pref-timeout"></html:label>
      <html:input
        id="zca-timeout"
        type="number"
        min="1000"
        preference="timeoutMs"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zca-temperature"
        data-l10n-id="pref-temperature"
      ></html:label>
      <html:input
        id="zca-temperature"
        type="number"
        min="0"
        max="2"
        step="0.1"
        preference="temperature"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zca-max-tokens"
        data-l10n-id="pref-max-tokens"
      ></html:label>
      <html:input
        id="zca-max-tokens"
        type="number"
        min="1"
        preference="maxOutputTokens"
      ></html:input>
    </hbox>
    <checkbox preference="sendAbstract" data-l10n-id="pref-send-abstract" />
    <checkbox
      preference="sendSimilarAbstracts"
      data-l10n-id="pref-send-similar-abstracts"
    />
  </groupbox>

  <groupbox>
    <label><html:h3 data-l10n-id="pref-index-title"></html:h3></label>
    <checkbox
      preference="semanticEnabled"
      data-l10n-id="pref-semantic-enabled"
    />
    <hbox>
      <button id="zca-test-semantic" data-l10n-id="pref-test-semantic"></button>
      <button
        id="zca-build-semantic-index"
        data-l10n-id="pref-build-semantic-index"
      ></button>
      <button
        id="zca-clear-semantic"
        data-l10n-id="pref-clear-semantic"
      ></button>
    </hbox>
    <html:p id="zca-semantic-status" aria-live="polite"></html:p>
    <button id="zca-rebuild-index" data-l10n-id="pref-rebuild-index"></button>
    <html:p data-l10n-id="pref-index-note"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h3 data-l10n-id="pref-privacy-title"></html:h3></label>
    <html:p data-l10n-id="pref-privacy-note"></html:p>
  </groupbox>

  <html:p id="zca-pref-status" aria-live="polite"></html:p>
  <html:small
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version": "__buildVersion__"}'
  ></html:small>
</vbox>
